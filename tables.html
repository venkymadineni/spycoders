<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Python full stack</title>
    </head>
    <body style="background-color: rgb(230, 173, 188);text-align: center;">
        <h1 style="background-color: grey;text-align: center;">Time Table</h1>
        <table style="border-spacing: 1px;padding: 5px;border: 1px solid black;border-collapse: collapse;width: 70%;height: 200px;background-color: green;text-align: center;margin:auto;">
            <tr style="height: 50px">
                <th style="border: 1px solid black">Day</th>
                <th style="border: 1px solid black">10:30-12:00</th>
                <th style="border: 1px solid black">14:00-15:30</th>
            </tr>
            <tr style="height: 50px">
                <td style="border: 1px solid black">Monday</td>
                <td style="border: 1px solid black">Front End</td>
                <td style="border: 1px solid black">Back End</td>
            </tr>
            <tr style="height: 50px">
                <td style="border: 1px solid black">Tuesday</td>
                <td style="border: 1px solid black"rowspan="2">Back End</td>
                <td style="border: 1px solid black" rowspan="2">Front End</td>
            </tr>
            <tr style="height: 50px">
                <td style="border: 1px solid black">Wednesday</td>

            </tr>
            <tr style="height: 50px">
                <td style="border: 1px solid black">Thursday</td>
                <td style="border: 1px solid black" colspan="2">Front End</td>

            </tr>
            <tr style="height: 50px">
                <td style="border: 1px solid black">Friday</td>
                <td style="border: 1px solid black"colspan="2">Back End</td>
     
            </tr>
            <tr style="height: 50px">
                <td style="border: 1px solid black" >Saturday</td>
                <td style="border: 1px solid black">Communication</td>
                <td style="border: 1px solid black">Team Meeting</td>
            </tr>
        </table>
    </body>
</html>
